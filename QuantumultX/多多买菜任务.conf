# 合并到Quantumult X本地配置的[task_local]，不要增加重复定时任务。
# Cookie/登录请求沿用本机pdd_pickup_request_v1；Worker认证读取本机$prefs。
# 首次配置可在软件本地URL后临时加#worker=HTTPS根地址&token=上传令牌。
# 执行一次保存后移除#参数。需要Quantumult X v1.5.6 build 918及以上。
[task_local]
0 */15 * * * * https://raw.githubusercontent.com/kazeyo666/scriptable_ios/main/QuantumultX/%E5%A4%9A%E5%A4%9A%E4%B9%B0%E8%8F%9C%E8%87%AA%E5%8A%A8%E5%88%B7%E6%96%B0.js, tag=多多买菜自动刷新, enabled=true
